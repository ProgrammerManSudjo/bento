[Rainmeter]
Update=250
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Yasb Bento
Author=yasb-setup
Information=Black bento tiles: clock, seconds, calendar, hours, uptime.

[Variables]
Mono=GeistMono NF
MonoBold=GeistMono NF SemiBold
Sans=Geist
Accent=255,255,255
Grain=140,140,140
@Include=#@#Accent.inc

[S]
Measure=Script
ScriptFile=#CURRENTPATH#Bento.lua

[mUp]
Measure=Uptime

[mTime]
Measure=Time
Format=%H:%M

[mDate]
Measure=Time
Format=%A, %d %B

[mSec]
Measure=Time
Format=%S

