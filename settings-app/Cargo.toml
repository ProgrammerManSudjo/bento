[package]
name = "yasb-settings"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp"] }
regex = "1"
rfd = "0.17.2"
serde_json = { version = "1", features = ["preserve_order"] }
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_Graphics_Gdi"] }
yaml-rust2 = "0.13.0"

[profile.release]
strip = true
opt-level = "s"
lto = true
